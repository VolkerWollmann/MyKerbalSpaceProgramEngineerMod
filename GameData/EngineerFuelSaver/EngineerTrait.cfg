// Haengt dem Ingenieur die Faehigkeit FuelSavingSkill an, damit die Ersparnis im
// Infoblock des Kerbals steht (Astronautenzentrum, Crew-Auswahl).
//
// Mehrere EXPERIENCE_TRAIT-Nodes mit demselben name werden von KSP zusammengefuehrt -
// denselben Weg benutzt die Serenity-Erweiterung, um dem Ingenieur den
// DeployedSciencePowerSkill zu ergaenzen. Ein ModuleManager wird dafuer nicht gebraucht.
//
// Der Effekt fuehrt bewusst keine modifiers: die Prozentwerte stehen ausschliesslich
// in EngineerFuelSaver.cfg unter fuelSavingPerLevel, damit nichts auseinanderlaufen kann.

EXPERIENCE_TRAIT
{
	name = Engineer
	title = #autoLOC_500103
	desc = #autoLOC_500104

	EFFECT
	{
		name = FuelSavingSkill
	}
}
