// EngineerFuelSaver - Konfiguration
//
// Ein Ingenieur an Bord senkt den Treibstoffverbrauch aller Triebwerke des Schiffs.
// Es zaehlt nur der hoechste Ingenieurs-Level an Bord, nicht die Summe aller Ingenieure.

ENGINEER_FUEL_SAVER
{
	// Ersparnis pro Sterne-Level. 0.01 = 1 % je Level.
	fuelSavingPerLevel = 0.01

	// Sterne, die dem Ingenieur beim Bonus zusaetzlich gutgeschrieben werden.
	// 1 = ein Level-1-Ingenieur spart so viel wie sonst ein Level-2-Ingenieur.
	// Level 0 (frischer Ingenieur) bleibt ohne Bonus, gedeckelt wird bei maxLevel.
	// Mit den Standardwerten ergibt das fuer Level 0 bis 5: 0 %, 2 %, 3 %, 4 %, 5 %, 5 %.
	// 0 = alte Kurve mit 1 % je Stern.
	levelOffset = 1

	// Hoechstes beruecksichtigtes Level (Stock-Maximum ist 5).
	maxLevel = 5

	// Harte Obergrenze der Ersparnis, unabhaengig von den Werten oben.
	maxFuelSaving = 0.9

	// Sekunden zwischen zwei Neuberechnungen im Flug.
	refreshInterval = 0.5

	// Wenn die Kerbal-Erfahrung deaktiviert ist (typisch im Sandbox-Modus),
	// behandelt KSP jeden Kerbal als voll ausgebildet.
	// True  = Ingenieure geben dort den vollen Bonus
	// False = Bonus ist dort komplett abgeschaltet
	fullBonusWhenExperienceDisabled = True

	// Triebwerke, die einen dieser Treibstoffe nutzen, bekommen keinen Bonus.
	// Komma-getrennt, leer lassen um alle Triebwerke einzuschliessen.
	excludedPropellants = SolidFuel

	// Ausfuehrliche Ausgabe je Schiff und Triebwerk im KSP.log.
	debugLog = False

	// NUR ZUM TESTEN: der Ingenieur an Bord zaehlt als dieses Level, egal welches
	// er wirklich hat. Ein echter Ingenieur muss weiterhin mitfliegen bzw. im
	// Crew-Manifest zugewiesen sein - ohne ihn bleibt es bei 0 %.
	// -1 = aus (Normalbetrieb).
	debugLevelOverride = -1

	// Text der Faehigkeit im Infoblock des Kerbals (Astronautenzentrum, Crew-Auswahl).
	// Platzhalter: <saving> Ersparnis dieses Kerbals, <level> sein Level,
	// <perLevel> Ersparnis pro Level, <maxSaving> maximale Ersparnis,
	// <maxLevel> hoechstes Level. Sprache frei waehlbar.
	//
	// ACHTUNG: keine geschweiften Klammern im Text - die sind im cfg-Format
	// Node-Klammern und schneiden den Wert samt aller folgenden Zeilen ab.
	// Auch kein // im Text, das beginnt einen Kommentar.
	// Steht bewusst als letzter Schluessel, damit ein Fehler hier nichts anderes trifft.
	effectDescription = FuelSaving:<saving>
}
